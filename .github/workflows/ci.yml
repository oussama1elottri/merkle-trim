name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fl-engine/scripts/requirements.txt
          pip install "click<8.2.0" "rich<14.0.0"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'contracts/package-lock.json'

      - name: Install Hardhat contract dependencies
        working-directory: ./contracts
        run: npm ci

      - name: Run Hardhat smart contract tests
        working-directory: ./contracts
        run: npx hardhat test

      - name: Run Python/Solidity cross-language Merkle parity verification
        run: python3 fl-engine/scripts/test_merkle_verification.py
